openapi: 3.1.0
info:
  title: Delsign delegated signing API
  version: "2026-10-29"
  summary: Server-held Ethereum keys; every transfer approved with the user's own RSA key.
  description: |
    The server holds an Ethereum private key for each of a user's addresses and signs
    transactions with it, but only when the request carries a signature from the user's
    registered RSA key. A valid JWT alone can't move funds or replace the RSA key.

    Read `client-guide.md` alongside this spec: it gives the exact strings to sign, key
    formats, and what each error means for a client. `test-vectors.json` has worked
    signatures for checking a client's signing code.

    Conventions:
    - Every endpoint needs `Authorization: Bearer <JWT>`. Token problems get **403**, not 401.
      401 is used only for a send whose RSA signature doesn't verify.
    - Request bodies are JSON with exactly the listed fields: an unknown field gets a 400.
    - Error responses are `text/plain` with a short human-readable message. The message
      text is not a stable contract; switch on the status code.
    - Wei amounts are decimal **strings**, because JavaScript numbers can't hold them exactly.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:3010
    description: Local development (DELSIGN_PORT defaults to 3010)
security:
  - bearerAuth: []
tags:
  - name: users
    description: RSA key registration and lookup
  - name: wallets
    description: Wallets and their addresses
  - name: chain
    description: Balances and transfers

paths:
  /api/v1/authping:
    get:
      operationId: authPing
      summary: Check a token
      description: Succeeds with an empty body if the token is valid. Useful as a login check.
      responses:
        "200":
          description: The token is valid. The body is empty.
        "403":
          $ref: "#/components/responses/AuthFailed"

  /api/v1/keyreg:
    post:
      operationId: registerKey
      tags: [users]
      summary: Register or replace your RSA public key
      description: |
        **First registration:** send `email`, `pubkey` and `sig4reg`. The JWT is enough.

        **Replacement:** if a key is already registered, also send `sig4rotate`, the
        *current* key's signature over `email + pubkey` (the new key's hex appended to the
        email). Without it, or with a bad one, the request gets a 403. There is no recovery
        path for a lost key.

        `sig4reg` is always the *new* key's signature over `email`, proving the caller holds it.
        See client-guide.md for the exact messages.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyReg"
            examples:
              firstRegistration:
                summary: First registration (test vector "register", key1)
                value:
                  email: "a@example.com"
                  pubkey: ""
                  sig4reg: ""
              rotation:
                summary: Replacing key1 with key2 (test vector "rotate")
                value:
                  email: "a@example.com"
                  pubkey: ""
                  sig4reg: ""
                  sig4rotate: ""
      responses:
        "200":
          description: Key registered or replaced. The body is empty.
        "400":
          description: |
            Malformed body, a missing field, `email` not matching the token's email,
            a `pubkey` that isn't a hex PKIX RSA key, or a `sig4reg` that doesn't verify.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorText"
              example: Email mismatch
        "403":
          description: |
            Either a token problem (see AuthFailed), or a key is already registered and
            `sig4rotate` is missing or doesn't verify against it.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorText"
              example: A key is already registered; replacing it needs sig4rotate from the current key
        "409":
          description: |
            The registered key changed while this request was being handled (a concurrent
            registration or rotation). Fetch `GET /api/v1/users/{email}` and retry if needed.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorText"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/NotJSON"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/users/{email}:
    get:
      operationId: getUser
      tags: [users]
      summary: Your own registration
      description: Only your own email can be looked up; any other email gets a 403.
      parameters:
        - name: email
          in: path
          required: true
          description: Must equal the token's `email` claim.
          schema:
            type: string
          example: a@example.com
      responses:
        "200":
          description: Your registered key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfo"
              example:
                email: a@example.com
                pubkey: ""
        "403":
          description: A token problem (see AuthFailed), or the email isn't yours.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorText"
        "404":
          description: You haven't registered a key yet.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorText"
              example: No key registered
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/wallets:
    post:
      operationId: createWallet
      tags: [wallets]
      summary: Create a wallet
      description: |
        Creates an empty wallet. No request body is needed (any body is ignored).
        Wallet ids are unique across all users, so don't assume your first wallet is 1.
      responses:
        "201":
          description: The new wallet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletInfo"
              example:
                id: 2
        "403":
          $ref: "#/components/responses/AuthFailed"
        "500":
          $ref: "#/components/responses/ServerError"
    get:
      operationId: listWallets
      tags: [wallets]
      summary: Your wallet ids
      responses:
        "200":
          description: Your wallet ids, in no particular order; `[]` if you have none.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
                  format: int64
              example: [2, 5]
        "403":
          $ref: "#/components/responses/AuthFailed"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/wallets/{id}/addresses:
    post:
      operationId: createAddress
      tags: [wallets]
      summary: Create an address in one of your wallets
      description: |
        The server generates a new Ethereum key for the address and stores it encrypted.
        No request body is needed. The new address has no funds.
      parameters:
        - name: id
          in: path
          required: true
          description: A wallet id from `createWallet` or `listWallets`.
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 2
      responses:
        "201":
          description: The new address, in checksum form.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EOA"
              example:
                eoa: "0x17155B71982feD535Fd6aeB084C9330e7d5C290f"
        "400":
          description: The wallet id isn't a positive integer.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorText"
              example: Invalid wallet id
        "403":
          description: A token problem (see AuthFailed), or the wallet doesn't exist or isn't yours.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorText"
              example: Wallet is not yours
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/walletctx:
    get:
      operationId: listWalletAddresses
      tags: [wallets]
      summary: All your wallets and addresses
      description: |
        One entry per address, ordered by wallet id. Wallets with no addresses don't appear;
        use `listWallets` for those.
      responses:
        "200":
          description: Your addresses with their wallet ids; `[]` if you have none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WalletAddressPair"
              example:
                - walletId: 2
                  address: "0x17155B71982feD535Fd6aeB084C9330e7d5C290f"
                - walletId: 2
                  address: "0x812B8C4D02f5901C7Dcdac0526bA915B61dAc33c"
        "403":
          $ref: "#/components/responses/AuthFailed"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/wallets/balance/{address}:
    get:
      operationId: getBalance
      tags: [chain]
      summary: Balance of an address, in wei
      description: Works for any Ethereum address, not only your own.
      parameters:
        - name: address
          in: path
          required: true
          description: An Ethereum address, in any letter case.
          schema:
            $ref: "#/components/schemas/Address"
          example: "0x17155B71982feD535Fd6aeB084C9330e7d5C290f"
      responses:
        "200":
          description: The latest balance. `address` is returned in checksum form.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Balance"
              example:
                address: "0x17155B71982feD535Fd6aeB084C9330e7d5C290f"
                amount: "1000000000000000000"
        "400":
          description: Not an Ethereum address.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorText"
              example: Invalid address
        "403":
          $ref: "#/components/responses/AuthFailed"
        "502":
          $ref: "#/components/responses/NodeError"

  /api/v1/wallets/send:
    post:
      operationId: sendEth
      tags: [chain]
      summary: Send ETH from one of your addresses
      description: |
        `sig` is the user's RSA signature over the concatenation
        `source + dest + amount + requestId + expiry`, using the strings exactly as they
        appear in this request (addresses in the same letter case, `expiry` in decimal).
        See client-guide.md.

        Each request needs a fresh `requestId`; a reused one gets a 409. `expiry` must be
        in the future and at most 5 minutes ahead. The `requestId` is recorded once the
        signature verifies, **before** the transaction is broadcast, so after a 502 retry
        with a new `requestId` (and a new signature), not the same body.

        The server sends an EIP-1559 transfer (21000 gas), so `dest` must be an account
        that accepts plain ETH transfers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendRequest"
            examples:
              send:
                summary: Send 0.001 ETH (test vector "send", signed with key1)
                value:
                  source: "0x17155B71982feD535Fd6aeB084C9330e7d5C290f"
                  dest: "0x812B8C4D02f5901C7Dcdac0526bA915B61dAc33c"
                  amount: "1000000000000000"
                  requestId: "6f1c2a7e-0b9d-4c55-9a43-2f1e8d7c6b5a"
                  expiry: 1800000060
                  sig: ""
      responses:
        "200":
          description: The transaction was broadcast (not yet mined).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendResult"
              example:
                txnid: "0x45d1e539f4bf4b3304730d126fef71bbaf7240d3f828d80736f3059c1944fe66"
        "400":
          description: |
            Malformed body, an invalid address, an `amount` that isn't a canonical positive
            decimal string (a JSON number is rejected too), a `requestId` that isn't a UUID,
            or an `expiry` in the past or more than 5 minutes ahead.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorText"
              examples:
                numberAmount:
                  value: 'Request body could not be decoded: amount must be a JSON string of decimal digits (wei), e.g. "1000"'
                expired:
                  value: request expired
        "401":
          description: |
            `sig` doesn't verify against your registered key. Usually the message was built
            differently from the request (letter case, amount formatting), or the browser's
            key isn't the registered one.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorText"
              example: Invalid signature
        "403":
          description: A token problem (see AuthFailed), or `source` isn't one of your addresses.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorText"
              example: Source address is not yours
        "409":
          description: This `requestId` was already used. Nothing new was sent.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorText"
              example: Request already processed (requestId reused)
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/NotJSON"
        "500":
          $ref: "#/components/responses/ServerError"
        "502":
          $ref: "#/components/responses/NodeError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        An HS256 JWT signed with the server's `DELSIGN_JWT_SECRET`, issued by the identity
        provider. It must have a non-empty `email` claim and an `exp` claim. Missing,
        malformed, expired or wrongly signed tokens get a 403.

  responses:
    AuthFailed:
      description: |
        Missing `Authorization` header, not `Bearer <token>`, or the token is invalid,
        expired, has no `exp`, uses an algorithm other than HS256, or has no `email` claim.
      content:
        text/plain:
          schema:
            $ref: "#/components/schemas/ErrorText"
          example: Invalid token
    NotJSON:
      description: A `Content-Type` header was sent and it isn't `application/json`.
      content:
        text/plain:
          schema:
            $ref: "#/components/schemas/ErrorText"
          example: Content-Type header is not application/json
    TooLarge:
      description: The request body is over 1 MB.
      content:
        text/plain:
          schema:
            $ref: "#/components/schemas/ErrorText"
    ServerError:
      description: An internal error. The body is generic; details are only in the server log.
      content:
        text/plain:
          schema:
            $ref: "#/components/schemas/ErrorText"
          example: Internal Server Error
    NodeError:
      description: |
        The Ethereum node couldn't be reached or rejected the request (for a send: e.g.
        insufficient funds for value plus gas). The body has the node's error.
      content:
        text/plain:
          schema:
            $ref: "#/components/schemas/ErrorText"
          example: "ethereum node error: broadcast: insufficient funds for gas * price + value"

  schemas:
    ErrorText:
      type: string
      description: A short human-readable message, followed by a newline. Not a stable contract.

    Address:
      type: string
      description: A 20-byte Ethereum address as 0x-prefixed hex, in any letter case.
      pattern: "^0[xX][0-9a-fA-F]{40}$"

    Wei:
      type: string
      description: |
        An amount in wei as a base-10 string, with no sign, leading zeros, decimal point or
        exponent, at most 2^256 - 1. Parse with `BigInt(s)` in JavaScript, never `Number`.
      pattern: "^(0|[1-9][0-9]*)$"
      maxLength: 78
      examples: ["1000000000000000000"]

    HexString:
      type: string
      description: Lowercase or uppercase hex, no 0x prefix.
      pattern: "^[0-9a-fA-F]+$"

    KeyReg:
      type: object
      additionalProperties: false
      required: [email, pubkey, sig4reg]
      properties:
        email:
          type: string
          description: Must equal the token's `email` claim.
        pubkey:
          $ref: "#/components/schemas/HexString"
          description: The new RSA public key, hex of its PKIX (SubjectPublicKeyInfo) DER encoding.
        sig4reg:
          $ref: "#/components/schemas/HexString"
          description: The new key's PKCS#1 v1.5 SHA-256 signature over `email`, hex.
        sig4rotate:
          $ref: "#/components/schemas/HexString"
          description: |
            Only when replacing a registered key: the current key's signature over
            `email + pubkey`, hex.

    UserInfo:
      type: object
      additionalProperties: false
      required: [email, pubkey]
      properties:
        email:
          type: string
        pubkey:
          $ref: "#/components/schemas/HexString"

    WalletInfo:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: integer
          format: int64

    EOA:
      type: object
      additionalProperties: false
      required: [eoa]
      properties:
        eoa:
          $ref: "#/components/schemas/Address"

    WalletAddressPair:
      type: object
      additionalProperties: false
      required: [walletId, address]
      properties:
        walletId:
          type: integer
          format: int64
        address:
          $ref: "#/components/schemas/Address"

    Balance:
      type: object
      additionalProperties: false
      required: [address, amount]
      properties:
        address:
          $ref: "#/components/schemas/Address"
        amount:
          $ref: "#/components/schemas/Wei"

    SendRequest:
      type: object
      additionalProperties: false
      required: [source, dest, amount, requestId, expiry, sig]
      properties:
        source:
          $ref: "#/components/schemas/Address"
          description: One of your addresses.
        dest:
          $ref: "#/components/schemas/Address"
        amount:
          $ref: "#/components/schemas/Wei"
          description: Positive.
        requestId:
          type: string
          format: uuid
          description: A fresh UUID per request, e.g. from `crypto.randomUUID()`.
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
        expiry:
          type: integer
          format: int64
          description: Unix time in seconds; in the future and at most 300 seconds ahead.
        sig:
          $ref: "#/components/schemas/HexString"
          description: RSA PKCS#1 v1.5 SHA-256 signature over `source + dest + amount + requestId + expiry`, hex.

    SendResult:
      type: object
      additionalProperties: false
      required: [txnid]
      properties:
        txnid:
          type: string
          description: The transaction hash, 0x-prefixed.
          pattern: "^0x[0-9a-fA-F]{64}$"
